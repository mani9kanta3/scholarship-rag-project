<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarship Eligibility Assistant</title>
    <!-- Font Awesome, for the icons. The free CDN build rather than a
         personal kit, so this works from any machine and any domain. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Two typefaces, which is the single biggest difference between
         this and a page that looks like nobody chose a font.

         Inter for everything that is read as language. It was drawn for
         screens at small sizes, which is what a form full of 13px
         labels actually is.

         JetBrains Mono for every number: scores, token counts, chunk
         lengths, latencies. Figures in a proportional face wander, so a
         column of them does not line up and two scores a reader wants
         to compare are hard to compare. In a monospace they sit in a
         grid, which is the whole reason data tables use one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
