# Render blueprint for the API.
#
# Three things here are deliberate.
#
# 1. It installs requirements-serve.txt, not requirements.txt. The
#    development set carries PyTorch and the cross-encoder and needs
#    about 700 MB in memory. The free instance gives 512 MB. The serve
#    set swaps torch for fastembed, which runs the same embedding
#    weights through ONNX, and lands at roughly 300 MB.
#
# 2. There is no database here. Postgres lives on Neon, on its own free
#    tier that does not expire after 30 days the way Render's does.
#
# 3. The Chroma index is not stored anywhere either. Postgres holds the
#    durable copy of every embedding and the app rebuilds the index from
#    it at startup, in seconds and with no re-embedding. So a free tier
#    that wipes its disk on every restart costs nothing, because the
#    vector store is derived data.

services:
  - type: web
    name: scholarship-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"

      # Run the embedding model through ONNX. torch is not installed here.
      - key: EMBEDDING_BACKEND
        value: onnx
      - key: RERANKER_ENABLED
        value: "false"

      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_JUDGE_MODEL
        value: openai/gpt-oss-safeguard-20b

      # Everything below is set in the Render dashboard, never in this
      # file. sync:false means "ask me, do not read it from git".
      - key: GROQ_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSLMODE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
