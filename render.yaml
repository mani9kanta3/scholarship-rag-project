# Render blueprint: the API, the database and the React page.
#
# The Chroma index is not stored anywhere here, on purpose. The free
# tier has no persistent disk, so anything written to it is gone on the
# next restart. Postgres holds the durable copy of every embedding and
# app/main.py rebuilds the index from it at startup, which takes a few
# seconds and costs nothing because no re-embedding happens.
#
# That is the answer to "what happens when your vector store dies":
# nothing is lost, because the vector store is derived data.

databases:
  - name: scholarship-db
    databaseName: scholarship_rag
    user: scholarship
    plan: free

services:
  - type: web
    name: scholarship-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: scholarship-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scholarship-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: scholarship-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: scholarship-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scholarship-db
          property: password
      # Set these in the Render dashboard, not here. Nothing secret
      # belongs in a file that goes to GitHub.
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGINS
        value: https://scholarship-web.onrender.com

  - type: web
    name: scholarship-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://scholarship-api.onrender.com/api
    routes:
      # A single page app. Every path has to serve index.html, or a
      # refresh on /schemes/12 returns a 404 from the static server
      # before React Router ever sees it.
      - type: rewrite
        source: /*
        destination: /index.html
