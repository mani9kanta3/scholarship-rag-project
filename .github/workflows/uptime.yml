# Keep the API awake during the hours anyone might look at it, and
# notice when it is actually broken.
#
# The free Render instance sleeps after fifteen minutes idle and takes
# about fifty seconds to wake, so the first visitor after a quiet spell
# sits looking at nothing. A request every ten minutes keeps it up.
#
# **Why only part of the day.** Render gives 750 instance-hours a month
# across the whole workspace, and a month is about 730 hours. Keeping
# one service awake around the clock would therefore eat very nearly
# the entire allowance on its own and starve every other service in the
# account. Sixteen hours a day is about 480 a month, which leaves real
# headroom. The cost is that someone arriving at three in the morning
# waits for a cold start, which is a fair trade.
#
# The schedule is in UTC and I am in IST, which is UTC+5:30. Hours 2 to
# 17 UTC are 07:30 to 23:29 at home, so the window covers the day
# without me having to think about it again.
#
# **This is a health check, not only a ping.** It fails if the body does
# not say ok, or if the index is empty. A service that is running with
# nothing in its vector store answers every question with "I could not
# find anything" and looks perfectly healthy from the outside, which is
# the failure I would least like to discover from a recruiter.
#
# Two honest limits. GitHub delays scheduled workflows when it is busy,
# sometimes by ten or fifteen minutes, so this is a weaker guarantee
# than a real uptime service. And scheduled workflows are switched off
# automatically after sixty days without a commit to the repository.

name: uptime

on:
  schedule:
    - cron: "*/10 2-17 * * *"
  # So it can be run by hand from the Actions tab without waiting.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the API is up and has its index
        run: |
          URL="https://scholarship-api-ffzu.onrender.com/api/health"

          # Three attempts. The first one after a sleep pays for the
          # cold start, and failing on that would cry wolf every single
          # morning.
          for attempt in 1 2 3; do
            echo "attempt $attempt"
            BODY=$(curl -sS --max-time 120 "$URL" || true)

            if echo "$BODY" | grep -q '"status":"ok"'; then
              INDEXED=$(echo "$BODY" | sed -n 's/.*"chunks_indexed":\([0-9]*\).*/\1/p')
              echo "indexed chunks: ${INDEXED:-unknown}"

              if [ -z "$INDEXED" ] || [ "$INDEXED" -eq 0 ]; then
                echo "The API is up but its vector index is empty."
                echo "It will answer every question with nothing found."
                echo "$BODY"
                exit 1
              fi

              echo "healthy"
              exit 0
            fi

            echo "no healthy reply yet"
            sleep 30
          done

          echo "The API did not answer in three attempts over several minutes."
          echo "Last reply was: ${BODY:-(nothing at all)}"
          exit 1
